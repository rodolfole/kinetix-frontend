name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TODO: drop continue-on-error once plans/PLAN-11 T1 removes the
      # 27 pre-existing type errors (triage table there).
      - name: Astro check
        run: pnpm exec astro check
        continue-on-error: true

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm exec astro build
